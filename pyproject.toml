[project]
name = "object-oriented-programming"
version = "0.1.0"
description = ""
authors = [
    {name = "Василий",email = "kulikov821999@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.9.0"
isort = "^7.0.0"


[tool.poetry.group.devtools.dependencies]
pytest = "^8.4.2"


[tool.isort]
line_length = 119
profile = "black"


[tool.black]
line-length = 119
exclude = ".*\\.git.*"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ".*\\venv.*"
